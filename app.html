<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A5F96" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maziwa Smart</title>

    <!-- Brand icons (public/brand/). The manifest link is added by vite-plugin-pwa (vite.config.js). -->
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Shared links (customer statements) preview with the brand card. -->
    <meta property="og:title" content="Maziwa Smart" />
    <meta property="og:image" content="https://www.maziwasmart.co.ke/brand/og-image.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1008" />

    <!-- The sidebar logo, so it is there on the first paint. -->
    <link rel="preload" as="image" type="image/svg+xml" href="/brand/logo-horizontal.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
