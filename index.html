<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Filled from src/landing/content.js by src/landing/landingPlugin.js. -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{SITE_URL}}/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0A5F96" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:url" content="{{SITE_URL}}/" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1008" />
    <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <meta name="twitter:image:alt" content="{{OG_IMAGE_ALT}}" />

    <!-- landing:jsonld -->

    <script>
      document.documentElement.classList.add('js');
      // Signed-in users in this tab go straight to their workspace.
      try {
        if (sessionStorage.getItem('jivu_user')) location.replace('/app');
      } catch {
        // Storage blocked: stay on the landing page.
      }
    </script>

    <!-- The header logo and the hero photo are preloaded; every other image lazy-loads. -->
    <link rel="preload" as="image" type="image/svg+xml" href="/brand/logo-horizontal.svg" />
    <!-- landing:preload -->

    <!-- Landing fonts: Manrope for text, JetBrains Mono for phone numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" />
    <link rel="stylesheet" href="/src/landing/landing.css" />
    <script type="module" src="/src/landing/landing.js"></script>
  </head>
  <body>
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-button focus:bg-white focus:px-4 focus:py-3 focus:text-ink-900">Skip to content</a>
    <!-- landing:page -->
  </body>
</html>
